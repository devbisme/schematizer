[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schematizer"
version = "0.1.0"
description = "Turn a generic hierarchical netlist (JSON) into a KiCad schematic."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Dave Vandenbout", email = "dave@vdb.name" }]
keywords = ["KiCad", "schematic", "netlist", "EDA", "SKiDL"]
# The Python-version classifiers feed the README's PyPI "pyversions" badge;
# keep them in step with requires-python and the tox env_list.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

# The placement/routing/writer engine and a lightweight IR are vendored under
# src/schematizer/engine, so the package is independent of skidl at runtime.
# Its only runtime dependency is the S-expression reader/writer.
dependencies = [
    "simp_sexp",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/devbisme/schematizer"
Repository = "https://github.com/devbisme/schematizer"
Issues = "https://github.com/devbisme/schematizer/issues"

[project.scripts]
schematizer = "schematizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendored KiCad power-symbol library (GND, +3V3, …) used when a net name
# matches a power symbol. Keeps the tool self-contained.
schematizer = ["data/*.kicad_sym"]

[tool.black]
line-length = 88

# Run the test suite against each supported Python with `tox` (or one with
# `tox -e py312`). Interpreters come from the global pyenv setting, which puts
# python3.8 … python3.14 on PATH so tox can find them.
[tool.tox]
requires = ["tox>=4.21"]
env_list = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "run the test suite with {base_python}"
extras = ["test"]
# Use the local skidl checkout (editable) instead of the PyPI release.
deps = ["-e {tox_root}/../skidl"]
# deps = ["skidl"]
set_env = { SKIDL_TOOL = "KICAD9" }
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]
