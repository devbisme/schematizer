[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schematizer"
version = "0.2.0"
description = "Turn a generic hierarchical netlist (JSON) into a KiCad schematic."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Dave Vandenbout" }]
keywords = ["KiCad", "schematic", "netlist", "EDA", "SKiDL"]

# The placement/routing/writer engine and a lightweight IR are vendored under
# src/schematizer/engine, so the package is independent of skidl at runtime.
# Its only runtime dependency is the S-expression reader/writer.
dependencies = [
    "simp_sexp",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
schematizer = "schematizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendored KiCad power-symbol library (GND, +3V3, …) used when a net name
# matches a power symbol. Keeps the tool self-contained.
schematizer = ["data/*.kicad_sym"]

[tool.black]
line-length = 88
